name: Release Docker image

on:
  workflow_run:
    workflows:
      - Mehrafarin CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mehrafarin-release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      trigger: ${{ steps.resolve.outputs.trigger }}
    steps:
      - name: Resolve TARGET_SHA and evaluate release gate
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          THIS_REPO: ${{ github.repository }}
          THIS_REPO_ID: ${{ github.repository_id }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WR_EVENT: ${{ github.event.workflow_run.event || '' }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          WR_REPO_ID: ${{ github.event.workflow_run.repository.id || '' }}
        run: |
          set -euo pipefail

          proceed="false"
          trigger="none"
          target_sha=""

          current_main_sha() {
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${THIS_REPO}/commits/main" \
              | jq -r '.sha'
          }

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Manual release must run from refs/heads/main (got ${GITHUB_REF})"
              exit 1
            fi
            target_sha="${GITHUB_SHA}"
            trigger="manual"
            proceed="true"

          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            trigger="automatic-ci-success"

            if [[ "${WR_CONCLUSION}" != "success" ]]; then
              echo "Skipping automatic release: CI conclusion is '${WR_CONCLUSION}' (not success)."
            elif [[ "${WR_EVENT}" != "push" ]]; then
              echo "Skipping automatic release: triggering CI event was '${WR_EVENT}' (not push)."
            elif [[ "${WR_HEAD_BRANCH}" != "main" ]]; then
              echo "Skipping automatic release: CI head branch was '${WR_HEAD_BRANCH}' (not main)."
            elif [[ "${WR_HEAD_REPO}" != "${THIS_REPO}" ]]; then
              echo "Skipping automatic release: CI head repository '${WR_HEAD_REPO}' is not '${THIS_REPO}'."
            elif [[ -n "${WR_REPO_ID}" && "${WR_REPO_ID}" != "${THIS_REPO_ID}" ]]; then
              echo "Skipping automatic release: workflow_run repository id mismatch."
            elif [[ ! "${WR_HEAD_SHA}" =~ ^[0-9a-f]{40,64}$ ]]; then
              echo "::error::Invalid workflow_run head_sha."
              exit 1
            else
              target_sha="${WR_HEAD_SHA}"
              current_main="$(current_main_sha)"
              if [[ ! "${current_main}" =~ ^[0-9a-f]{40,64}$ ]]; then
                echo "::error::Failed to resolve current origin/main SHA."
                exit 1
              fi
              if [[ "${target_sha}" != "${current_main}" ]]; then
                echo "Skipping automatic release: tested commit is no longer current main HEAD."
                echo "TARGET_SHA=${target_sha}"
                echo "origin/main=${current_main}"
              else
                proceed="true"
              fi
            fi

          else
            echo "::error::Unsupported event '${EVENT_NAME}'."
            exit 1
          fi

          if [[ "${proceed}" == "true" ]]; then
            if [[ ! "${target_sha}" =~ ^[0-9a-f]{40,64}$ ]]; then
              echo "::error::Refusing release with invalid TARGET_SHA."
              exit 1
            fi
          else
            target_sha="${target_sha:-none}"
          fi

          {
            echo "proceed=${proceed}"
            echo "target_sha=${target_sha}"
            echo "trigger=${trigger}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Release gate"
            echo
            echo "- Event: \`${EVENT_NAME}\`"
            echo "- Trigger: \`${trigger}\`"
            echo "- Proceed: \`${proceed}\`"
            echo "- TARGET_SHA: \`${target_sha}\`"
            if [[ "${proceed}" != "true" && "${EVENT_NAME}" == "workflow_run" ]]; then
              echo "- Result: automatic release skipped (no production changes)."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: release
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      image_tag: ${{ steps.image.outputs.tag }}
      target_sha: ${{ needs.gate.outputs.target_sha }}
      trigger: ${{ needs.gate.outputs.trigger }}
    steps:
      - name: Require main branch (manual) / confirm automatic context
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ needs.gate.outputs.trigger }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Refused: releases must run from refs/heads/main (got ${GITHUB_REF})"
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            if [[ "${TRIGGER}" != "automatic-ci-success" ]]; then
              echo "Refused: unexpected automatic trigger marker (${TRIGGER})"
              exit 1
            fi
          else
            echo "Refused: unsupported event (${EVENT_NAME})"
            exit 1
          fi

      - name: Verify Docker Hub secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Required Docker Hub repository secrets are not configured."
            exit 1
          fi

      - name: Checkout exact TARGET_SHA
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.target_sha }}
          persist-credentials: false

      - name: Confirm checkout matches TARGET_SHA
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${head_sha}" != "${TARGET_SHA}" ]]; then
            echo "Refused: checkout HEAD ${head_sha} != TARGET_SHA ${TARGET_SHA}"
            exit 1
          fi
          echo "Checked out TARGET_SHA=${TARGET_SHA}"

      - name: Setup Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Set image reference
        id: image
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          echo "tag=thnhit/mehrafarin:sha-${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build image (linux/amd64, no push)
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.image.outputs.tag }}

      # Trivy: informational (all CRITICAL) then blocking (fixable CRITICAL only).
      - name: Report all CRITICAL vulnerabilities (informational)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          exit-code: "0"
          severity: CRITICAL
          ignore-unfixed: "false"

      - name: Block on fixable CRITICAL vulnerabilities
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: "true"

      - name: Log in to Docker Hub
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push immutable SHA tag
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.tag }}"

      - name: Resolve pushed image digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${{ steps.image.outputs.tag }}" --format '{{.Manifest.Digest}}')"
          if [ -z "${digest}" ]; then
            echo "Failed to resolve image digest"
            exit 1
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Refused: digest is not an immutable sha256 reference (${digest})"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved digest: ${digest}"

      - name: Write job summary
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          TRIGGER: ${{ needs.gate.outputs.trigger }}
        run: |
          set -euo pipefail
          {
            echo "## Release Docker image"
            echo
            echo "- Trigger: \`${TRIGGER}\`"
            echo "- TARGET_SHA: \`${TARGET_SHA}\`"
            echo "- Immutable image tag: \`${{ steps.image.outputs.tag }}\`"
            echo "- Immutable deploy ref: \`thnhit/mehrafarin@${{ steps.digest.outputs.digest }}\`"
            echo "- Image digest: \`${{ steps.digest.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Validation: npm lint, tsc, build, audit: passed"
            echo "- Trivy informational CRITICAL scan: completed"
            echo "- Trivy blocking fixable-CRITICAL scan: passed"
            echo "- Docker Hub push: completed"
            echo "- Next: deploy-production job (Environment production)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: deploy-production
    needs:
      - gate
      - release
    if: needs.gate.outputs.proceed == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: mehrafarin-production-deploy
      cancel-in-progress: false
    steps:
      - name: Require main branch (manual) / confirm automatic context
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ needs.gate.outputs.trigger }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Refused: production deploy must run from refs/heads/main (got ${GITHUB_REF})"
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            if [[ "${TRIGGER}" != "automatic-ci-success" ]]; then
              echo "Refused: unexpected automatic trigger marker (${TRIGGER})"
              exit 1
            fi
          else
            echo "Refused: unsupported event (${EVENT_NAME})"
            exit 1
          fi

      - name: Re-check TARGET_SHA is still current main HEAD
        id: freshness
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_main="$(
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${THIS_REPO}/commits/main" \
              | jq -r '.sha'
          )"
          if [[ "${TARGET_SHA}" != "${current_main}" ]]; then
            echo "::error::Refusing deploy: TARGET_SHA is no longer current main HEAD. Production was not changed."
            echo "TARGET_SHA=${TARGET_SHA}"
            echo "origin/main=${current_main}"
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "deploy=true" >> "${GITHUB_OUTPUT}"
          echo "TARGET_SHA still matches origin/main (${TARGET_SHA})."

      - name: Validate release digest and construct image ref
        id: target
        env:
          RELEASE_DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Release digest missing or invalid."
            exit 1
          fi
          image="thnhit/mehrafarin@${RELEASE_DIGEST}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Deploy target: ${image}"

      - name: Verify production deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            SSH_HOST \
            SSH_PORT \
            SSH_USER \
            SSH_KNOWN_HOSTS \
            SSH_PRIVATE_KEY
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "${SSH_PORT}" =~ ^[0-9]+$ ]]; then
            echo "::error::SSH_PORT must be numeric."
            exit 1
          fi

      - name: Configure restricted SSH client
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          key_file="${HOME}/.ssh/mehrafarin_deploy"

          # Normalize key material from GitHub secrets:
          # - CRLF → LF
          # - literal "\n" sequences → real newlines (common paste mistake)
          # - ensure trailing newline (required by OpenSSH)
          printf '%s' "${SSH_PRIVATE_KEY}" \
            | tr -d '\r' \
            | sed 's/\\n/\n/g' \
            > "${key_file}"
          printf '\n' >> "${key_file}"
          chmod 600 "${key_file}"

          if ! grep -q 'BEGIN .*PRIVATE KEY' "${key_file}"; then
            echo "::error::SSH_PRIVATE_KEY does not look like an OpenSSH/PEM private key (missing BEGIN line)."
            exit 1
          fi

          printf '%s\n' "${SSH_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

          if ! ssh-keygen -y -f "${key_file}" >/dev/null; then
            echo "::error::SSH_PRIVATE_KEY is unreadable by OpenSSH (wrong key, truncated, or passphrase-protected)."
            exit 1
          fi

      - name: Deploy immutable digest via forced-command SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_IMAGE: ${{ steps.target.outputs.image }}
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_IMAGE}" =~ ^thnhit/mehrafarin@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Refusing to deploy non-immutable image reference."
            exit 1
          fi
          remote_cmd="deploy ${DEPLOY_IMAGE}"
          ssh \
            -i "${HOME}/.ssh/mehrafarin_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "${remote_cmd}"

      - name: Write deploy summary
        if: success()
        env:
          DEPLOY_IMAGE: ${{ steps.target.outputs.image }}
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          TRIGGER: ${{ needs.gate.outputs.trigger }}
        run: |
          set -euo pipefail
          {
            echo "## Production deployment"
            echo
            echo "- Environment: \`production\`"
            echo "- Trigger: \`${TRIGGER}\`"
            echo "- TARGET_SHA: \`${TARGET_SHA}\`"
            echo "- Deployed image: \`${DEPLOY_IMAGE}\`"
            echo "- Health verification: performed server-side by deploy-mehrafarin"
            echo "- Note: host port 2580 is bound to 127.0.0.1 only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub deploy SSH key from runner
        if: always()
        run: |
          set -euo pipefail
          rm -f "${HOME}/.ssh/mehrafarin_deploy"
